# Builds the garden and publishes it to GitHub Pages.
#
# The only difference between this and the Vercel/Netlify builds is BASE_PATH:
# a GitHub Pages *project* site is served from /<repo>/, so every asset URL has
# to be prefixed. Vite handles that from one environment variable, which is why
# the same source deploys to all three hosts unchanged.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check and build
        # Serve from /<repo>/ unless the repo is a user/organisation site.
        run: |
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            BASE_PATH="/" npm run build
          else
            BASE_PATH="/${{ github.event.repository.name }}/" npm run build
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
